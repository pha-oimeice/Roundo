# Shortcut identities and function assignments are local editable resources.
[input_slots."roundo.move-up"]
display_name = "Move Up"
functions = ["roundo.move-up"]

[input_slots."roundo.move-down"]
display_name = "Move Down"
functions = ["roundo.move-down"]

[input_slots."roundo.move-left"]
display_name = "Move Left"
functions = ["roundo.move-left"]

[input_slots."roundo.move-right"]
display_name = "Move Right"
functions = ["roundo.move-right"]

[input_slots."roundo.move-forward"]
display_name = "Move Forward"
functions = ["roundo.move-forward"]

[input_slots."roundo.move-backward"]
display_name = "Move Backward"
functions = ["roundo.move-backward"]

# Client-owned shortcut resources.
[input_slots.look]
display_name = "视角"
functions = ["roundo.look"]

[[input_bindings]]
slot = "look"
key = "mouse_motion"

[[input_bindings]]
slot = "roundo.move-up"
key = "space"

[[input_bindings]]
slot = "roundo.move-down"
key = "shift_left"

[[input_bindings]]
slot = "roundo.move-left"
key = "key_a"

[[input_bindings]]
slot = "roundo.move-right"
key = "key_d"

[[input_bindings]]
slot = "roundo.move-forward"
key = "key_w"

[[input_bindings]]
slot = "roundo.move-backward"
key = "key_s"
