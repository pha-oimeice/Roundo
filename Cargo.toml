[workspace]
members = [
    "src/rust/game/common/roundo_block_interaction",
    "src/rust/game/common/roundo_contracts",
    "src/rust/game/common/roundo_scene",
    "src/rust/game/common/roundo_controller",
    "src/rust/game/common/roundo_creature",
    "src/rust/game/common/roundo_marionette",
    "src/rust/game/common/roundo_local_coordinate",
    "src/rust/game/common/roundo_life",
    "src/rust/game/common/roundo_inventory",
    "src/rust/game/common/roundo_items",
    "src/rust/game/common/roundo_economy",
    "src/rust/game/roundo_ecs_entry",
    "src/rust/infra/roundo_toolbox",
    "src/rust/infra/roundo_mod_manager",
    "src/rust/roundo_server",
    "src/rust/roundo_client",
    "src/rust/infra/roundo_cli",
    "src/rust/infra/roundo_user_config",
    "src/rust/infra/roundo_dsa",
    "src/rust/infra/roundo_networking",
    "src/rust/infra/roundo_networking/proc_macro",
    "src/rust/infra/roundo_quinnet",
    "src/rust/game/client/roundo_rendering",
    "src/rust/game/common/roundo_presence",
    "src/rust/game/common/roundo_portal",
    "src/rust/game/common/roundo_player",
    "src/rust/roundo_client/roundo_ui",
    "src/rust/infra/roundo_proc_macros",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0
debug-assertions = true
incremental = true
lto = "off"
opt-level = 0
overflow-checks = true
strip = "debuginfo"

[profile.release]
debug = 0
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
strip = "debuginfo"

[workspace.dependencies]
anyhow = "1.0"
avian3d = "0.8"
bevy = { version = "0.20.1", default-features = false, features = ["bevy_scene", "bevy_state", "bevy_winit", "bevy_render", "bevy_pbr", "bevy_text", "bevy_audio", "bevy_ui_render", "bevy_feathers", "custom_cursor", "complex_script_segmentation", "tonemapping_luts", "zstd_rust", "x11"] }
crossbeam = "0.8"
env_logger = "0.11"
log = "0.4"
num-traits = "0.2"
open = "5.4.5"
openusd = { git = "https://github.com/mxpv/openusd", rev = "900ea31591348e3fbf416d4661d703aa8700771b" }
postcard = { version = "1.1", features = ["use-std"] }
rand = "0.10"
rand_chacha = "0.10"
quinn = "0.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
thiserror = "2.0.18"
tokio = { version = "1", features = ["sync", "rt"] }
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
roundo_proc_macros = { path = "src/rust/infra/roundo_proc_macros" }
# ---
roundo_dsa = {path = "src/rust/infra/roundo_dsa" }
roundo_block_interaction = { path = "src/rust/game/common/roundo_block_interaction" }
roundo_contracts = { path = "src/rust/game/common/roundo_contracts" }
roundo_scene = { path = "src/rust/game/common/roundo_scene" }
roundo_controller = { path = "src/rust/game/common/roundo_controller" }
roundo_creature = { path = "src/rust/game/common/roundo_creature" }
roundo_cli = { path = "src/rust/infra/roundo_cli" }
roundo_ecs_entry = { path = "src/rust/game/roundo_ecs_entry", default-features = false }
roundo_life = { path = "src/rust/game/common/roundo_life" }
roundo_inventory = { path = "src/rust/game/common/roundo_inventory" }
roundo_items = { path = "src/rust/game/common/roundo_items" }
roundo_economy = { path = "src/rust/game/common/roundo_economy" }
roundo_marionette = { path = "src/rust/game/common/roundo_marionette" }
roundo_networking_proc_macro = { path = "src/rust/infra/roundo_networking/proc_macro" }
roundo_quinnet = { path = "src/rust/infra/roundo_quinnet" }
roundo_rendering = {path = "src/rust/game/client/roundo_rendering" }
roundo_presence = { path = "src/rust/game/common/roundo_presence" }
roundo_player = { path = "src/rust/game/common/roundo_player" }
roundo_portal = { path = "src/rust/game/common/roundo_portal" }
roundo_local_coordinate = { path = "src/rust/game/common/roundo_local_coordinate" }
roundo_mod_manager = { path = "src/rust/infra/roundo_mod_manager" }
roundo_toolbox = { path = "src/rust/infra/roundo_toolbox" }
roundo_ui = { path = "src/rust/roundo_client/roundo_ui" }
roundo_user_config = { path = "src/rust/infra/roundo_user_config" }
