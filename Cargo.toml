[package]
name = "roundo_bin"
version.workspace = true
edition.workspace = true

[dependencies]
bevy.workspace = true
chrono.workspace = true
roundo_infrastructure.workspace = true
roundo_local_coordinate.workspace = true
roundo_rendering.workspace = true

[features]
dev = ["bevy/debug", "bevy/file_watcher"]
release = []

[workspace]
members = [
    "crates/game/roundo_block_interaction",
    "crates/game/roundo_contracts",
    "crates/game/roundo_controller",
    "crates/game/roundo_creature",
    "crates/game/roundo_marionette",
    "crates/game/roundo_local_coordinate",
    "crates/game/roundo_life",
    "crates/game/roundo_inventory",
    "crates/game/roundo_items",
    "crates/game/roundo_economy",
    "crates/roundo_infrastructure",
    "crates/roundo_infrastructure/roundo_cli",
    "crates/roundo_infrastructure/roundo_cli/proc_macro",
    "crates/roundo_infrastructure/roundo_dsa",
    "crates/roundo_infrastructure/roundo_mod_manager",
    "crates/roundo_infrastructure/roundo_networking",
    "crates/roundo_infrastructure/roundo_networking/proc_macro",
    "crates/roundo_infrastructure/roundo_networking/roundo_quinnet",
    "crates/roundo_infrastructure/roundo_toolbox",
    "crates/roundo_infrastructure/roundo_user_config",
    "crates/roundo_rendering",
    "crates/game/roundo_presence",
    "crates/game/roundo_portal",
    "crates/game/roundo_player",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0
debug-assertions = true
incremental = true
lto = "off"
opt-level = 0
overflow-checks = true
strip = "debuginfo"

[profile.release]
debug = 0
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
strip = "debuginfo"

[workspace.dependencies]
avian3d = "0.8"
bevy = { version = "0.20.1", default-features = false, features = ["bevy_scene", "bevy_state", "bevy_winit", "bevy_render", "bevy_pbr", "bevy_text", "bevy_audio", "bevy_ui_render", "bevy_feathers", "custom_cursor", "complex_script_segmentation", "tonemapping_luts", "zstd_rust", "x11"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossbeam = "0.8"
log = "0.4"
num-traits = "0.2"
openusd = { git = "https://github.com/mxpv/openusd", rev = "900ea31591348e3fbf416d4661d703aa8700771b" }
postcard = { version = "1.1", features = ["use-std"] }
rand = "0.10"
rand_chacha = "0.10"
quinn = "0.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["sync", "rt"] }
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
proc-macro2 = "1"
proc-macro-crate = "3.5"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
# ---
roundo_infrastructure = { path = "crates/roundo_infrastructure" }
roundo_cli = { path = "crates/roundo_infrastructure/roundo_cli" }
roundo_cli_proc_macro = { path = "crates/roundo_infrastructure/roundo_cli/proc_macro" }
roundo_dsa = { path = "crates/roundo_infrastructure/roundo_dsa" }
roundo_mod_manager = { path = "crates/roundo_infrastructure/roundo_mod_manager" }
roundo_networking = { path = "crates/roundo_infrastructure/roundo_networking" }
roundo_networking_proc_macro = { path = "crates/roundo_infrastructure/roundo_networking/proc_macro" }
roundo_quinnet = { path = "crates/roundo_infrastructure/roundo_networking/roundo_quinnet" }
roundo_toolbox = { path = "crates/roundo_infrastructure/roundo_toolbox" }
roundo_user_config = { path = "crates/roundo_infrastructure/roundo_user_config" }
# ---
roundo_contracts = { path = "crates/game/roundo_contracts" }
roundo_creature = { path = "crates/game/roundo_creature" }
roundo_life = { path = "crates/game/roundo_life" }
roundo_inventory = { path = "crates/game/roundo_inventory" }
roundo_items = { path = "crates/game/roundo_items" }
roundo_rendering = { path = "crates/roundo_rendering" }
roundo_player = { path = "crates/game/roundo_player" }
roundo_local_coordinate = { path = "crates/game/roundo_local_coordinate" }
