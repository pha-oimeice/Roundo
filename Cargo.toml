[workspace]
members = [
    "src/rust/game/common/roundo_block_interaction",
    "src/rust/game/common/roundo_contracts",
    "src/rust/game/common/roundo_scene",
    "src/rust/game/common/roundo_controller",
    "src/rust/game/common/roundo_creature",
    "src/rust/game/common/roundo_marionette",
    "src/rust/game/common/roundo_local_coordinate",
    "src/rust/game/common/roundo_lifecycle",
    "src/rust/game/common/roundo_life",
    "src/rust/game/common/roundo_inventory",
    "src/rust/game/common/roundo_items",
    "src/rust/game/common/roundo_economy",
    "src/rust/game/roundo_ecs_entry",
    "src/rust/roundo_toolbox",
    "src/rust/roundo_server",
    "src/rust/roundo_client",
    "src/rust/roundo_cli",
    "src/rust/roundo_user_config",
    "src/rust/game/common/roundo_dsa",
    "src/rust/roundo_networking",
    "src/rust/roundo_game_network_bridge",
    "src/rust/game/client/roundo_rendering",
    "src/rust/game/common/roundo_presence",
    "src/rust/game/common/roundo_portal",
    "src/rust/game/common/roundo_player",
    "src/rust/roundo_client/roundo_webui",
    "src/rust/game/common/roundo_mod_loader",
    "src/rust/roundo_proc_macros",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0
debug-assertions = true
incremental = true
lto = "off"
opt-level = 0
overflow-checks = true
strip = "debuginfo"

[profile.release]
debug = 0
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
strip = "debuginfo"

[workspace.dependencies]
anyhow = "1.0"
argh = "0.1"
avian3d = "0.7"
bevy = { version = "0.19.1", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_pbr", "bevy_text", "bevy_audio"] }
bevy_winit = "0.19.1"
bevy_asset_loader = "0.27"
# bevy_egui = "0.41"
bevy_enhanced_camera = "0.5"
bevy_enhanced_input = "0.26"
# bevy-inspector-egui = "0.37"
cornucopia = "1"
crossbeam = "0.8"
env_logger = "0.11"
log = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
quinn = { version = "0.11" }
rand = "0.10"
rand_chacha = "0.10"
rustls = "0.23"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "time", "uuid",] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "1.1"
toml_edit = "0.25"
ttf-parser = "0.25"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
webview2-com = "0.38.2"
webpki-roots = "1"
wry = { version = "0.56" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
roundo_proc_macros = { path = "src/rust/roundo_proc_macros" }
# ---
roundo_dsa = {path = "src/rust/game/common/roundo_dsa" }
roundo_block_interaction = { path = "src/rust/game/common/roundo_block_interaction" }
roundo_contracts = { path = "src/rust/game/common/roundo_contracts" }
roundo_scene = { path = "src/rust/game/common/roundo_scene" }
roundo_controller = { path = "src/rust/game/common/roundo_controller" }
roundo_creature = { path = "src/rust/game/common/roundo_creature" }
roundo_cli = { path = "src/rust/roundo_cli" }
roundo_ecs_entry = { path = "src/rust/game/roundo_ecs_entry", default-features = false }
roundo_lifecycle = { path = "src/rust/game/common/roundo_lifecycle" }
roundo_life = { path = "src/rust/game/common/roundo_life" }
roundo_inventory = { path = "src/rust/game/common/roundo_inventory" }
roundo_items = { path = "src/rust/game/common/roundo_items" }
roundo_economy = { path = "src/rust/game/common/roundo_economy" }
roundo_marionette = { path = "src/rust/game/common/roundo_marionette" }
roundo_networking = {path = "src/rust/roundo_networking" }
roundo_game_network_bridge = { path = "src/rust/roundo_game_network_bridge", default-features = false }
roundo_rendering = {path = "src/rust/game/client/roundo_rendering" }
roundo_presence = { path = "src/rust/game/common/roundo_presence" }
roundo_player = { path = "src/rust/game/common/roundo_player" }
roundo_portal = { path = "src/rust/game/common/roundo_portal" }
roundo_local_coordinate = { path = "src/rust/game/common/roundo_local_coordinate" }
roundo_mod_loader = { path = "src/rust/game/common/roundo_mod_loader" }
roundo_toolbox = { path = "src/rust/roundo_toolbox" }
roundo_webui = { path = "src/rust/roundo_client/roundo_webui" }
roundo_user_config = { path = "src/rust/roundo_user_config" }
