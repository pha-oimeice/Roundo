<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Roundo</title>
  <style>
    body { margin: 0; background: #10151d; color: #f4f7fb; font: 20px sans-serif; display: grid; place-items: center; height: 100vh; user-select: none }
    main { text-align: center }
    h1 { font-size: 72px; letter-spacing: 12px; margin-bottom: 28px }
    button { display: block; width: 260px; margin: 12px; padding: 14px; background: #26384c; border: 1px solid #8eb9db; color: white; font: inherit; cursor: pointer }
    button:disabled { cursor: wait; opacity: .65 }
    #error { min-height: 1.5em; color: #ff9b9b; font-size: 16px }
    #startup { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1; background: #10151d }
    body.starting main { visibility: hidden }
  </style>
</head>
<body>
<main>
  <h1>ROUNDO</h1>
  <button onclick="run('ui.open',{import:'server-selection'})">Start</button>
  <button onclick="run('ui.open',{import:'settings'})">Settings</button>
  <button onclick="quit()">Quit</button>
  <p id="error" role="alert"></p>
</main>
<script>
let debugOpening = false;
roundo.subscribe('client.input', async events => {
  if (debugOpening || !events.some(event => event.function === 'roundo.debug' && event.state === 'pressed')) return;
  debugOpening = true;
  try { await roundo.execute({version: 1, command: 'ui.open', arguments: {import: 'debug'}}); }
  catch (error) { console.error(error); }
  finally { debugOpening = false; }
});
const introCookie = 'roundo_startup_intro_seen=1';

function hasShownIntro() {
  return document.cookie.split('; ').includes(introCookie);
}

function finishIntro() {
  document.cookie = `${introCookie}; Path=/; SameSite=Strict`;
  document.querySelector('#startup')?.remove();
  document.body.classList.remove('starting');
}

function showIntro() {
  if (hasShownIntro()) return;
  document.body.classList.add('starting');
  const startup = document.createElement('iframe');
  startup.id = 'startup';
  startup.title = 'Roundo startup animation';
  startup.src = 'startup.html';
  startup.addEventListener('load', () => startup.contentWindow.focus());
  document.body.append(startup);
}

async function run(command, argumentsValue) {
  const error = document.querySelector('#error');
  error.textContent = '';
  try {
    const result = await roundo.execute({ version: 1, command, arguments: argumentsValue });
    if (!result?.ok) {
      error.textContent = `[${result?.error?.code || 'command_error'}] ${result?.error?.message || 'Command failed'}`;
    }
  } catch (reason) {
    error.textContent = `[command_error] ${reason?.message || String(reason)}`;
  }
}

function quit() {
  run('app.quit', {});
}

window.addEventListener('message', event => {
  if (event.source === document.querySelector('#startup')?.contentWindow && event.data === 'roundo:startup-complete') {
    finishIntro();
  }
});
showIntro();
</script>
</body>
</html>
