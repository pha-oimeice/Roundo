<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roundo · 运行诊断</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><div><small>ROUNDO / DEBUG WORKSPACE</small><h1>运行诊断</h1></div><div class="toolbar"><span id="connection" role="status">读取连接状态…</span><button id="bindings">修改快捷键</button><button id="close">返回目录 · Esc</button></div></header>
  <div id="message" role="status" aria-live="polite">以下是客户端订阅的原始诊断数据，不替代服务端权威状态。按需展开。</div>
  <section class="card" aria-label="运行诊断"><div class="diagnostics"><details><summary>连接详情</summary><pre id="runtime-connection">等待数据</pre></details><details><summary>帧率 / 相机 / 指向</summary><pre id="runtime-hud">等待数据</pre></details><details><summary>玩家控制器获取状态</summary><pre id="runtime-control">等待数据</pre></details></div></section>
  <footer><span id="shortcut">正在读取快捷键绑定…</span></footer>
</main><script src="navigation.js"></script>
</body></html>
