<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title>
<style>
body{margin:0;background:#10151d;color:#f4f7fb;font:18px sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(760px,90vw)}button,input,select{margin:5px;padding:9px;background:#26384c;border:1px solid #8eb9db;color:white;font:inherit}.tabs button.active{background:#477397}.panel{display:none}.panel.active{display:block}label.setting{display:grid;grid-template-columns:1fr 2fr auto auto auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #425}.binding,.editor{padding:10px;border-bottom:1px solid #425}.binding.selected{background:#1b2b3b}.binding-actions{color:#c8dced}.actions{display:flex;flex-wrap:wrap;gap:4px}.actions label{display:block;border:0;padding:2px 6px}.error{color:#ff9b9b;min-height:1.5em}.hint{color:#aab}.editor select{min-width:180px}
</style></head><body><main><h1>Settings</h1><div class="tabs"><button data-tab="controls" onclick="tab('controls')">Controls</button><button data-tab="camera" onclick="tab('camera')">Camera</button><button data-tab="bindings" onclick="tab('bindings')">Key bindings</button></div><section id="controls" class="panel"></section><section id="camera" class="panel"></section><section id="bindings" class="panel"></section><p id="error" class="error" role="alert"></p><button onclick="roundo.execute({version:1,command:'ui.back',arguments:{}})">Back</button></main>
<script>
let active=sessionStorage.settingsTab||'controls';
let bindingModel={bindings:[],supported_keys:[],supported_actions:[]};
let selectedBinding=null;
let bindingDraft=null;

function errorText(result){const error=result&&result.error;return error?`[${error.code||'command_error'}] ${error.message||'Command failed'}`:''}
function showResult(result){document.querySelector('#error').textContent=result&&result.ok?'':errorText(result);return Boolean(result&&result.ok)}
function tab(id){active=id;sessionStorage.settingsTab=id;document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));}
function command(name,argumentsValue){return roundo.execute({version:1,command:name,arguments:argumentsValue})}
function settingValue(def,value){return Math.min(def.max,Math.max(def.min,Number(value)))}
async function saveSetting(def,value){const result=await command('settings.set',{key:def.key,value:settingValue(def,value)});if(showResult(result))loadSettings()}
function settingRow(def){const row=document.createElement('label');row.className='setting';
 const name=document.createElement('span');name.textContent=def.key;
 const slider=document.createElement('input');slider.type='range';slider.min=def.min;slider.max=def.max;slider.step=def.step;slider.value=def.value;
 const number=document.createElement('input');number.type='number';number.min=def.min;number.max=def.max;number.step=def.step;number.value=def.value;number.setAttribute('aria-label',`${def.key} value`);
 const minus=document.createElement('button');minus.type='button';minus.textContent='−';
 const plus=document.createElement('button');plus.type='button';plus.textContent='+';
 const reset=document.createElement('button');reset.type='button';reset.textContent='Default';
 const preview=value=>{const normalized=settingValue(def,value);slider.value=normalized;number.value=normalized;return normalized};
 slider.addEventListener('input',()=>preview(slider.value));slider.addEventListener('change',()=>saveSetting(def,slider.value));
 number.addEventListener('change',()=>saveSetting(def,preview(number.value)));
 minus.addEventListener('click',()=>saveSetting(def,preview(Number(number.value)-Number(def.step))));
 plus.addEventListener('click',()=>saveSetting(def,preview(Number(number.value)+Number(def.step))));
 reset.addEventListener('click',()=>saveSetting(def,def.default));
 row.append(name,slider,number,minus,plus,reset);return row}
async function loadSettings(){const result=await command('settings.show',{});if(!showResult(result))return;for(const section of ['controls','camera'])document.querySelector('#'+section).replaceChildren();for(const setting of result.data.settings){const section=setting.key.startsWith('controls')?'controls':'camera';document.querySelector('#'+section).append(settingRow(setting))}}
function optionList(select,keys,selected){for(const key of keys){const option=document.createElement('option');option.value=key.key;option.textContent=key.display_name;option.selected=key.key===selected;select.append(option)}}
function actionChooser(actions,selected,onChange){const group=document.createElement('div');group.className='actions';for(const action of actions){const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=selected.includes(action.action);check.addEventListener('change',()=>onChange(action.action,check.checked));label.append(check,` ${action.display_name}`);group.append(label)}return group}
function bindingEditor(mode){const editor=document.createElement('form');editor.className='editor';const title=document.createElement('b');title.textContent=mode==='edit'?'Edit binding':'Add binding';
 const keyLabel=document.createElement('label');keyLabel.textContent='Key ';const keySelect=document.createElement('select');optionList(keySelect,bindingModel.supported_keys,bindingDraft.key);keySelect.addEventListener('change',()=>bindingDraft.key=keySelect.value);keyLabel.append(keySelect);
 const actionsLabel=document.createElement('div');actionsLabel.textContent='Actions';actionsLabel.append(actionChooser(bindingModel.supported_actions,bindingDraft.actions,(action,checked)=>{bindingDraft.actions=checked?[...bindingDraft.actions,action]:bindingDraft.actions.filter(value=>value!==action)}));
 const save=document.createElement('button');save.textContent='Save';const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.addEventListener('click',()=>{bindingDraft=null;selectedBinding=null;renderBindings()});
 editor.addEventListener('submit',async event=>{event.preventDefault();if(!bindingDraft.actions.length){document.querySelector('#error').textContent='[invalid_arguments] Select at least one action.';return}const result=mode==='edit'?await command('bindings.replace',{old_binding:bindingDraft.old_binding,binding:{key:bindingDraft.key,actions:bindingDraft.actions}}):await command('bindings.bind',{key:bindingDraft.key,actions:bindingDraft.actions});if(showResult(result)){bindingDraft=null;selectedBinding=null;loadBindings()}});
 editor.append(title,keyLabel,actionsLabel,save,cancel);return editor}
function renderBindings(){const section=document.querySelector('#bindings');section.replaceChildren();for(const binding of bindingModel.bindings){const row=document.createElement('div');row.className=`binding ${selectedBinding===binding?'selected':''}`;const title=document.createElement('b');const key=bindingModel.supported_keys.find(item=>item.key===binding.key);title.textContent=key?key.display_name:binding.key;const actions=document.createElement('span');actions.className='binding-actions';actions.textContent=': '+binding.actions.map(value=>bindingModel.supported_actions.find(item=>item.action===value)?.display_name||value).join(', ');const edit=document.createElement('button');edit.textContent='Edit';edit.addEventListener('click',()=>{selectedBinding=binding;bindingDraft={old_binding:{key:binding.key,actions:[...binding.actions]},key:binding.key,actions:[...binding.actions]};renderBindings()});const unbind=document.createElement('button');unbind.textContent='Unbind';unbind.addEventListener('click',async()=>{const result=await command('bindings.unbind',binding);if(showResult(result))loadBindings()});row.append(title,actions,edit,unbind);section.append(row)}
 if(bindingDraft)section.append(bindingEditor(bindingDraft.old_binding?'edit':'add'));else{const add=document.createElement('button');add.textContent='Add binding';add.addEventListener('click',()=>{bindingDraft={key:bindingModel.supported_keys[0]?.key||'',actions:[]};renderBindings()});section.append(add)}
}
async function loadBindings(){const result=await command('bindings.list',{});if(!showResult(result))return;bindingModel=result.data;renderBindings()}
loadSettings();loadBindings();tab(active)
</script></body></html>
