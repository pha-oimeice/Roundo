<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title>
<style>
body{margin:0;background:#10151d;color:#f4f7fb;font:18px sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(760px,90vw)}button,input,select{margin:5px;padding:9px;background:#26384c;border:1px solid #8eb9db;color:white;font:inherit}.tabs button.active{background:#477397}.panel{display:none}.panel.active{display:block}label.setting{display:grid;grid-template-columns:1fr 2fr auto auto auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #425}.binding,.editor{padding:10px;border-bottom:1px solid #425}.binding.selected{background:#1b2b3b}.binding-actions{color:#c8dced}.actions{display:flex;flex-wrap:wrap;gap:4px}.actions label{display:block;border:0;padding:2px 6px}.error{color:#ff9b9b;min-height:1.5em}.hint{color:#aab}.editor select{min-width:180px}
</style></head><body><main><h1>Settings</h1><div class="tabs"><button data-tab="controls" onclick="tab('controls')">Controls</button><button data-tab="camera" onclick="tab('camera')">Camera</button><button data-tab="world" onclick="tab('world')">World</button><button data-tab="bindings" onclick="tab('bindings')">Key bindings</button></div><section id="controls" class="panel"></section><section id="camera" class="panel"></section><section id="world" class="panel"></section><section id="bindings" class="panel"></section><p id="error" class="error" role="alert"></p><button onclick="roundo.execute({version:1,command:'ui.back',arguments:{}})">Back</button></main>
<script>
let debugOpening = false;
roundo.subscribe('client.input', async events => {
  if (debugOpening || !events.some(event => event.slot === 'roundo.debug' && event.state === 'pressed')) return;
  debugOpening = true;
  try { await roundo.execute({version: 1, command: 'ui.open', arguments: {import: 'debug'}}); }
  catch (error) { console.error(error); }
  finally { debugOpening = false; }
});
let active=sessionStorage.settingsTab||'controls';
let bindingModel={bindings:[],supported_keys:[],supported_slots:[]};
let selectedBinding=null;
let bindingDraft=null;

function errorText(result){const error=result&&result.error;return error?`[${error.code||'command_error'}] ${error.message||'Command failed'}`:''}
function showResult(result){document.querySelector('#error').textContent=result&&result.ok?'':errorText(result);return Boolean(result&&result.ok)}
function tab(id){active=id;sessionStorage.settingsTab=id;document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));}
function command(name,argumentsValue){return roundo.execute({version:1,command:name,arguments:argumentsValue})}
function settingValue(def,value){return Math.min(def.max??Infinity,Math.max(def.min,Number(value)))}
async function saveSetting(def,value){const result=await command('settings.set',{key:def.key,value:settingValue(def,value)});showResult(result)}
function settingRow(def){const row=document.createElement('label');row.className='setting';
 const name=document.createElement('span');name.textContent=def.key==='world.chunk_view_distance'?'View distance (chunks)':def.key;
 const slider=document.createElement('input');slider.type='range';slider.min=def.min;slider.step=def.step;slider.hidden=def.max==null;if(def.max!=null)slider.max=def.max;slider.value=def.value;
 const number=document.createElement('input');number.type='number';number.min=def.min;if(def.max!=null)number.max=def.max;number.step='any';number.value=def.value;number.setAttribute('aria-label',`${def.key} value`);
 const minus=document.createElement('button');minus.type='button';minus.textContent='−';
 const plus=document.createElement('button');plus.type='button';plus.textContent='+';
 const reset=document.createElement('button');reset.type='button';reset.textContent='Default';
 const preview=value=>{const normalized=settingValue(def,value);slider.value=normalized;number.value=normalized;return normalized};
 slider.addEventListener('input',()=>preview(slider.value));slider.addEventListener('change',()=>saveSetting(def,slider.value));
 number.addEventListener('change',()=>saveSetting(def,preview(number.value)));
 minus.addEventListener('click',()=>saveSetting(def,preview(Number(number.value)-Number(def.step))));
 plus.addEventListener('click',()=>saveSetting(def,preview(Number(number.value)+Number(def.step))));
 reset.addEventListener('click',()=>saveSetting(def,def.default));
 row.append(name,slider,number,minus,plus,reset);return row}
function receiveSettings(data){if(!data?.settings)return;for(const section of ['controls','camera','world'])document.querySelector('#'+section).replaceChildren();for(const setting of data.settings){const section=setting.key.startsWith('controls')?'controls':setting.key.startsWith('world')?'world':'camera';document.querySelector('#'+section).append(settingRow(setting))}}
function optionList(select,items,valueField,selected){for(const item of items){const option=document.createElement('option');option.value=item[valueField];option.textContent=item.display_name;option.selected=option.value===selected;select.append(option)}}
function bindingEditor(mode){const editor=document.createElement('form');editor.className='editor';const title=document.createElement('b');title.textContent=mode==='edit'?'Edit binding':'Add binding';
 const slotLabel=document.createElement('label');slotLabel.textContent='Input ';const slotSelect=document.createElement('select');optionList(slotSelect,bindingModel.supported_slots,'slot',bindingDraft.slot);slotSelect.addEventListener('change',()=>bindingDraft.slot=slotSelect.value);slotLabel.append(slotSelect);
 const keyLabel=document.createElement('label');keyLabel.textContent='Key ';const keySelect=document.createElement('select');optionList(keySelect,bindingModel.supported_keys,'key',bindingDraft.key);keySelect.addEventListener('change',()=>bindingDraft.key=keySelect.value);keyLabel.append(keySelect);
 const save=document.createElement('button');save.textContent='Save';const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.addEventListener('click',()=>{bindingDraft=null;selectedBinding=null;renderBindings()});
 editor.addEventListener('submit',async event=>{event.preventDefault();const binding={slot:bindingDraft.slot,key:bindingDraft.key};const result=mode==='edit'?await command('bindings.replace',{old_binding:bindingDraft.old_binding,binding}):await command('bindings.bind',binding);if(showResult(result)){bindingDraft=null;selectedBinding=null;renderBindings()}});
 editor.append(title,slotLabel,keyLabel,save,cancel);return editor}
function renderBindings(){const section=document.querySelector('#bindings');section.replaceChildren();for(const binding of bindingModel.bindings){const row=document.createElement('div');row.className=`binding ${selectedBinding===binding?'selected':''}`;const title=document.createElement('b');const slot=bindingModel.supported_slots.find(item=>item.slot===binding.slot);title.textContent=slot?slot.display_name:binding.slot;const key=bindingModel.supported_keys.find(item=>item.key===binding.key);const physical=document.createElement('span');physical.className='binding-actions';physical.textContent=': '+(key?key.display_name:binding.key);const edit=document.createElement('button');edit.textContent='Edit';edit.addEventListener('click',()=>{selectedBinding=binding;bindingDraft={old_binding:{...binding},...binding};renderBindings()});const unbind=document.createElement('button');unbind.textContent='Unbind';unbind.addEventListener('click',async()=>{const result=await command('bindings.unbind',binding);showResult(result)});row.append(title,physical,edit,unbind);section.append(row)}
 if(bindingDraft)section.append(bindingEditor(bindingDraft.old_binding?'edit':'add'));else{const add=document.createElement('button');add.textContent='Add binding';add.addEventListener('click',()=>{bindingDraft={slot:bindingModel.supported_slots[0]?.slot||'',key:bindingModel.supported_keys[0]?.key||''};renderBindings()});section.append(add)}
}
function receiveBindings(data){if(!data)return;bindingModel=data;renderBindings()}
roundo.subscribe('client.settings',receiveSettings);roundo.subscribe('client.bindings',receiveBindings);tab(active)
</script></body></html>
