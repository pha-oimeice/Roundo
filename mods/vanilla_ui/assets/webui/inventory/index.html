<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物品栏</title>
<style>
  :root { color-scheme: dark; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #e8eef6 }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: rgba(5, 9, 16, .64) }
  main { width: min(880px, 94vw); max-height: 90vh; display: flex; flex-direction: column; background: #121c29; border: 1px solid #3b526a; border-radius: 12px; box-shadow: 0 20px 80px #0008 }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px; border-bottom: 1px solid #2b3c50 }
  h1 { font-size: 24px; margin: 4px 0 }
  .eyebrow { color: #8db9db; font-size: 11px; letter-spacing: .18em }
  button { background: #23364b; border: 1px solid #55718f; border-radius: 6px; color: inherit; padding: 10px 16px; cursor: pointer; font: inherit }
  button:hover, button:focus-visible { background: #334d68; outline: 2px solid #8db9db }
  #content { overflow-y: auto; padding: 20px 28px }
  #status { margin: 0 0 20px; color: #a8bdd0; line-height: 1.7 }
  article { margin: 0 0 16px; padding: 18px; border: 1px solid #30445b; border-radius: 8px; background: #172333 }
  h2 { margin: 0 0 12px; font-size: 17px }
  h3 { font-size: 13px; font-weight: normal; color: #a8bdd0; margin: 14px 0 10px }
  .empty { margin: 0; color: #8499ad; font-size: 14px }
  ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px }
  li { min-width: 0; padding: 12px; background: #203248; border: 1px solid #3e5874; border-radius: 5px }
  li span { display: block; font-size: 12px; color: #8db9db; margin-bottom: 6px }
  code { font-size: 12px; overflow-wrap: anywhere; user-select: text }
  footer { padding: 14px 28px; border-top: 1px solid #2b3c50; font-size: 12px; color: #8499ad; line-height: 1.7 }
  #error { color: #ffb6ad; margin: 0 }
</style>
</head>
<body tabindex="-1">
<main aria-labelledby="title">
  <header>
    <div><div class="eyebrow">INVENTORY / 直接保管</div><h1 id="title">物品栏</h1></div>
    <button id="close" type="button" aria-label="关闭物品栏">关闭</button>
  </header>
  <div id="content">
    <p id="status" role="status" aria-live="polite">正在核验生命体绑定…</p>
    <div id="bodies"></div>
    <p id="error" role="alert"></p>
  </div>
  <footer>仅查看当前绑定生命体的相关概念体所直接持有的物品；不包含 Public 或嵌套物品栏。<br>当前仅提供查看，不提供移动、使用或丢弃操作。</footer>
</main>
<script>
const status = document.querySelector('#status');
const bodies = document.querySelector('#bodies');
const error = document.querySelector('#error');
const closeButton = document.querySelector('#close');
const roleNames = { intent: '意图概念体', execution: '执行概念体', record: '记录概念体' };
const messages = {
  not_bound: '尚未绑定到可检查的生命体。取得生命体的控制绑定后才能查看其物品栏。',
  loading: '正在读取服务端物品栏…',
  unavailable: '物品栏暂时不可用，正在等待服务端更新。',
  timeout: '物品栏读取超时，旧内容已隐藏，正在重新读取。',
  too_large: '物品栏超出当前只读视图的大小限制，未展示部分数据。',
};
let closing = false;

function element(tag, text, className) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}
function receiveInventory(snapshot) {
  bodies.replaceChildren();
  if (snapshot?.status !== 'ready') {
    status.textContent = messages[snapshot?.status] || '物品栏不可用。';
    return;
  }
  const entries = snapshot.bodies || [];
  const count = entries.reduce((sum, body) => sum + body.inventories.reduce((n, items) => n + items.length, 0), 0);
  status.textContent = `已绑定 · Controller ${snapshot.controller_id} · 直接持有 ${count} 件物品`;
  for (const body of entries) {
    const card = document.createElement('article');
    card.append(element('h2', roleNames[body.role] || body.role));
    if (body.inventories.length === 0) {
      card.append(element('p', '此概念体尚未创建物品栏。', 'empty'));
    }
    body.inventories.forEach((items, index) => {
      card.append(element('h3', `物品栏 ${index + 1} · ${items.length} 件`));
      if (items.length === 0) {
        card.append(element('p', '物品栏为空。', 'empty'));
        return;
      }
      const list = document.createElement('ul');
      for (const id of items) {
        const item = document.createElement('li');
        item.append(element('span', '物品 ID'), element('code', id));
        list.append(item);
      }
      card.append(list);
    });
    bodies.append(card);
  }
}
async function closeInventory() {
  if (closing) return;
  closing = true;
  closeButton.disabled = true;
  error.textContent = '';
  try {
    const result = await roundo.execute({ version: 1, command: 'ui.back', arguments: {} });
    if (!result.ok) throw new Error(result.error?.message || '关闭失败');
  } catch (reason) {
    closing = false;
    closeButton.disabled = false;
    error.textContent = reason.message || String(reason);
  }
}
closeButton.addEventListener('click', closeInventory);
roundo.subscribe('client.input', events => {
  if (events.some(event => event.slot === 'roundo.inventory' && event.state === 'pressed')) closeInventory();
  else if (events.some(event => event.slot === 'roundo.debug' && event.state === 'pressed')) {
    roundo.execute({version: 1, command: 'ui.open', arguments: {import: 'debug'}}).catch(console.error);
  }
});
roundo.subscribe('client.bindings', snapshot => {
  const keys = snapshot.bindings.filter(binding => binding.slot === 'roundo.inventory')
    .map(binding => snapshot.supported_keys.find(key => key.key === binding.key)?.display_name || binding.key);
  closeButton.textContent = `关闭 · ${keys.join(' / ') || '未绑定'} / Esc`;
});
window.addEventListener('roundo:focus', event => {
  if (event.detail?.state === 'focused' && !closing) closeButton.focus({ preventScroll: true });
});
window.addEventListener('roundo:destroying', () => bodies.replaceChildren());
roundo.subscribe('client.inventory', receiveInventory);
</script>
</body>
</html>
