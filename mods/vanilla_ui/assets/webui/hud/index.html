<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HUD</title>
  <style>
    body { margin: 0; color: #fff; font: 14px monospace; text-shadow: 1px 1px 2px #000; pointer-events: none }
    #crosshair { position: fixed; left: 50%; top: 50%; font: 28px sans-serif; transform: translate(-50%,-50%) }
    #stats { padding: 12px; white-space: pre-wrap }
    #inventory-hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); color: #ccddeb }
    #target { position: fixed; right: 12px; bottom: 12px; white-space: pre-wrap; text-align: right }
    #control-retry { position: fixed; left: 12px; bottom: 12px; padding: 10px; background: rgba(16, 21, 29, .88); border: 1px solid #d69b56; pointer-events: auto; font: 14px sans-serif; text-shadow: none }
    .control-entry + .control-entry { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(214, 155, 86, .45) }
    .control-entry button { margin-top: 6px; padding: 6px 10px }
  </style>
</head>
<body>
<div id="crosshair">+</div>
<div id="stats">Loading…</div>
<div id="target"></div>
<div id="inventory-hint"></div>
<section id="control-retry" hidden aria-live="polite"></section>
<script>
const stats = document.querySelector('#stats');
const target = document.querySelector('#target');
const controlRetry = document.querySelector('#control-retry');
let controls = [];
const retryPending = new Map();

function receiveHud(hud) {
  if (!hud) return;
  const position = hud.position?.absolute?.map(value => value.toFixed(2)).join(', ') || 'unavailable';
  const voxel = hud.position?.chunk_relative?.join(', ') || 'unavailable';
  stats.textContent = `FPS ${hud.fps.current.toFixed(1)}  avg ${hud.fps.average.toFixed(1)}  min ${hud.fps.min.toFixed(1)}  max ${hud.fps.max.toFixed(1)}\nPosition ${position}\nVoxel ${voxel}`;
  target.textContent = hud.target ? `Voxel ${hud.target.voxel}\nPosition ${hud.target.voxel_position.join(', ')}\nRelative ${hud.target.relative_position.join(', ')}\nChunk ${hud.target.chunk.join(', ')}\nLocal Coordinate ${hud.target.local_coordinate}` : '';
}

function controlKey(control) {
  return `${control.controller_id}/${control.request_id || ''}`;
}

function receiveControl(snapshot) {
  controls = Array.isArray(snapshot?.controls) ? snapshot.controls : [];
  renderControls();
}

function renderControls() {
  controlRetry.replaceChildren();
  controlRetry.hidden = controls.length === 0;
  for (const control of controls) {
    // IDs are decimal strings: JavaScript never converts ControllerId/u128 request IDs to Number.
    if (typeof control.controller_id !== 'string' || !/^\d+$/.test(control.controller_id)) continue;
    const key = controlKey(control);
    const entry = document.createElement('div');
    entry.className = 'control-entry';
    const status = document.createElement('div');
    status.textContent = `Controller ${control.controller_id}: ${control.state}`;
    entry.append(status);
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Retry control';
    button.disabled = !control.retryable || retryPending.has(key);
    button.addEventListener('click', () => retryControl(control, key, status));
    entry.append(button);
    controlRetry.append(entry);
  }
  controlRetry.hidden = controlRetry.childElementCount === 0;
}

async function retryControl(control, key, status) {
  if (!control.retryable || retryPending.has(key)) return;
  retryPending.set(key, true);
  renderControls();
  try {
    const result = await roundo.execute({
      version: 1,
      command: 'controller.retry-acquire',
      arguments: { controller_id: control.controller_id },
    });
    // The command reply identifies the replacement request; the next lifecycle
    // projection independently carries that same request_id for this controller.
    if (!result.ok) status.textContent = result.error?.message || 'Unable to retry control';
  } finally {
    retryPending.delete(key);
    renderControls();
  }
}

let opening = false;
roundo.subscribe('client.input', async events => {
  const action = events.find(event => event.state === 'pressed' && ['roundo.inventory', 'roundo.debug'].includes(event.function));
  if (!action || opening) return;
  opening = true;
  try {
    const result = await roundo.execute({version: 1, command: 'ui.open', arguments: {import: action.function === 'roundo.inventory' ? 'inventory' : 'debug'}});
    if (!result.ok) console.error('UI navigation failed', result.error);
  } catch (error) { console.error('UI navigation failed', error); }
  finally { opening = false; }
});
roundo.subscribe('client.bindings', snapshot => {
  const keys = snapshot.bindings.filter(binding => snapshot.supported_slots.some(slot => slot.slot === binding.slot && slot.functions.includes('roundo.inventory')))
    .map(binding => snapshot.supported_keys.find(key => key.key === binding.key)?.display_name || binding.key);
  document.querySelector('#inventory-hint').textContent = `${keys.join(' / ') || '未绑定'} · 物品栏`;
});
roundo.subscribe('client.hud', receiveHud);
roundo.subscribe('client.control', receiveControl);
</script>
</body>
</html>
