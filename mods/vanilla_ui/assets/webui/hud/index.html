<!doctype html><html><head><meta charset="utf-8"><title>HUD</title><style>body{margin:0;color:#fff;font:14px monospace;text-shadow:1px 1px 2px #000;pointer-events:none}#crosshair{position:fixed;left:50%;top:50%;font:28px sans-serif;transform:translate(-50%,-50%)}#stats{padding:12px;white-space:pre-wrap}#target{position:fixed;right:12px;bottom:12px;white-space:pre-wrap;text-align:right}</style></head><body><div id="crosshair">+</div><div id="stats">Loading…</div><div id="target"></div><script>let pending=false;async function update(){if(pending)return;pending=true;try{const r=await roundo.execute({version:1,command:'hud.show',arguments:{}});const h=r.data;if(!h)return;const p=h.position?.absolute?.map(x=>x.toFixed(2)).join(', ')||'unavailable';const c=h.position?.chunk_relative?.join(', ')||'unavailable';document.querySelector('#stats').textContent=`FPS ${h.fps.current.toFixed(1)}  avg ${h.fps.average.toFixed(1)}  min ${h.fps.min.toFixed(1)}  max ${h.fps.max.toFixed(1)}\nPosition ${p}\nVoxel ${c}`;document.querySelector('#target').textContent=h.target?`Voxel ${h.target.voxel}\nPosition ${h.target.voxel_position.join(', ')}\nRelative ${h.target.relative_position.join(', ')}\nChunk ${h.target.chunk.join(', ')}\nLocal Coordinate ${h.target.local_coordinate}`:''}finally{pending=false}}update();setInterval(update,50)</script></body></html>
