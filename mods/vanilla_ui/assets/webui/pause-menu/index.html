<!doctype html><html><head><meta charset="utf-8"><title>Paused</title><style>body{margin:0;background:rgba(5,8,12,.45);color:white;font:20px sans-serif;display:grid;place-items:center;height:100vh}main{text-align:center}button{display:block;width:240px;margin:10px;padding:12px;background:#26384c;border:1px solid #8eb9db;color:white;font:inherit}</style></head><body><main><h1>Paused</h1><button onclick="back()">Continue</button><button onclick="window.roundo.execute({version:1,command:'ui.open',arguments:{slot:'roundo.settings'}})">Settings</button><button onclick="leave()">Leave</button></main><script>async function back(){await roundo.execute({version:1,command:'ui.back',arguments:{}})}async function leave(){await roundo.execute({version:1,command:'server.disconnect',arguments:{}})}document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();back()}})</script></body></html>
