<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Paused</title>
  <style>
    body { margin: 0; background: rgba(5, 8, 12, .45); color: white; font: 20px sans-serif; display: grid; place-items: center; min-height: 100vh; user-select: none }
    main { text-align: center }
    button { display: block; width: 240px; margin: 10px; padding: 12px; background: #26384c; border: 1px solid #8eb9db; color: white; font: inherit }
    #control-retry { text-align: left; font-size: 16px }
    .control-entry { margin: 10px 0; padding: 10px; border: 1px solid #d69b56 }
    .control-error { color: #ff9b9b }
  </style>
</head>
<body tabindex="-1">
<main>
  <h1>Paused</h1>
  <button onclick="back()">Continue</button>
  <button onclick="window.roundo.execute({version:1,command:'ui.open',arguments:{import:'settings'}})">Settings</button>
  <button onclick="openDebug()">调试工具</button>
  <button onclick="leave()">Leave</button>
  <section id="control-retry" hidden aria-label="控制器状态与重试" aria-live="polite"></section>
  <p id="error" role="alert" style="color:#ff9b9b;max-width:480px"></p>
</main>
<script>
let closing = false;
let destroyed = false;
const controlRetry = document.querySelector('#control-retry');
let controls = [];
const retryPending = new Set();
const retryErrors = new Map();

function controlKey(control) {
  return `${control.controller_id}/${control.request_id || ''}`;
}

function receiveControl(snapshot) {
  if (destroyed) return;
  controls = snapshot.controls;
  const keys = new Set(controls.map(controlKey));
  for (const key of retryErrors.keys()) if (!keys.has(key)) retryErrors.delete(key);
  renderControls();
}

function renderControls() {
  if (destroyed) return;
  controlRetry.replaceChildren();
  controlRetry.hidden = controls.length === 0;
  for (const control of controls) {
    const key = controlKey(control);
    const entry = document.createElement('div');
    entry.className = 'control-entry';
    const status = document.createElement('div');
    status.textContent = `Controller ${control.controller_id}: ${control.state}`;
    entry.append(status);
    if (retryErrors.has(key)) {
      const error = document.createElement('p');
      error.className = 'control-error';
      error.textContent = retryErrors.get(key);
      entry.append(error);
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Retry control';
    button.disabled = !control.retryable || retryPending.has(key);
    button.addEventListener('click', () => retryControl(control, key));
    entry.append(button);
    controlRetry.append(entry);
  }
}

async function retryControl(control, key) {
  if (destroyed || !control.retryable || retryPending.has(key)) return;
  retryErrors.delete(key);
  retryPending.add(key);
  renderControls();
  try {
    const result = await roundo.execute({
      version: 1,
      command: 'controller.retry-acquire',
      arguments: {controller_id: control.controller_id},
    });
    // Status publication can replace this request while the command is pending.
    if (!destroyed && !result.ok && controls.some(current => controlKey(current) === key)) {
      retryErrors.set(key, result.error.message);
    }
  } catch (error) {
    if (!destroyed && controls.some(current => controlKey(current) === key)) {
      retryErrors.set(key, error?.message || String(error));
    }
  } finally {
    retryPending.delete(key);
    renderControls();
  }
}

function focusMenu() {
  if (closing) return;
  window.focus();
  document.body.focus({ preventScroll: true });
}

async function back() {
  if (closing) return;
  closing = true;
  const result = await roundo.execute({ version: 1, command: 'scene.resume', arguments: {} });
  if (!result.ok) closing = false;
}

let debugOpening = false;
async function openDebug() {
  if (debugOpening) return;
  debugOpening = true;
  const error = document.querySelector('#error');
  error.textContent = '';
  try {
    const result = await roundo.execute({ version: 1, command: 'ui.open', arguments: {import: 'debug'} });
    if (!result.ok) error.textContent = `[${result.error.code}] ${result.error.message}`;
  } catch (reason) {
    error.textContent = `无法打开调试工具：${reason.message || String(reason)}`;
  } finally { debugOpening = false; }
}

async function leave() {
  await roundo.execute({ version: 1, command: 'server.disconnect', arguments: {} });
}

const unsubscribeControl = roundo.subscribe('client.control', receiveControl);
window.addEventListener('roundo:destroying', () => {
  destroyed = true;
  unsubscribeControl();
  controls = [];
  retryErrors.clear();
  retryPending.clear();
  controlRetry.replaceChildren();
}, {once:true});

roundo.subscribe('client.input', events => {
  if (events.some(event => event.function === 'roundo.debug' && event.state === 'pressed')) openDebug();
});
window.addEventListener('roundo:focus', event => {
  if (event.detail?.state === 'focused') focusMenu();
});
window.addEventListener('roundo:visibility', event => {
  if (event.detail?.state === 'visible') focusMenu();
});
</script>
</body>
</html>
