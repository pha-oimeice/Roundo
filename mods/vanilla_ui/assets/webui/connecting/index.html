<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Connecting</title>
  <style>
    body { margin: 0; background: #10151d; color: #f4f7fb; font: 18px sans-serif; display: grid; place-items: center; height: 100vh; }
    main { text-align: center; min-width: 360px; }
    button { margin: 8px; padding: 10px 22px; background: #26384c; border: 1px solid #8eb9db; color: white; font: inherit; }
    button:disabled { cursor: wait; opacity: .65 }
  </style>
</head>
<body>
<main hidden>
  <h1 id="title">Connecting…</h1>
  <p id="server">No server selected</p>
  <p id="detail"></p>
  <button id="retry" type="button">Retry</button>
  <button id="disconnect" type="button">Cancel</button>
</main>
<script>
let debugOpening = false;
roundo.subscribe('client.input', async events => {
  if (debugOpening || !events.some(event => event.function === 'roundo.debug' && event.state === 'pressed')) return;
  debugOpening = true;
  try { await roundo.execute({version: 1, command: 'ui.open', arguments: {import: 'debug'}}); }
  catch (error) { console.error(error); }
  finally { debugOpening = false; }
});
const main = document.querySelector('main');
const title = document.querySelector('#title');
const server = document.querySelector('#server');
const detail = document.querySelector('#detail');
const retryButton = document.querySelector('#retry');
const disconnectButton = document.querySelector('#disconnect');
let commandPending = false;
let closing = false;

function setPending(value) {
  commandPending = value;
  retryButton.disabled = value;
  disconnectButton.disabled = value;
}

function receiveStatus(snapshot) {
  const connectionStatus = snapshot?.status?.status;
  if (!connectionStatus) return;
  if (connectionStatus === 'connected') {
    closeConnected();
    return;
  }
  server.textContent = snapshot.server ? `${snapshot.server.name} — ${snapshot.server.address}` : 'No server selected';
  title.textContent = connectionStatus.replaceAll('_', ' ');
  detail.textContent = connectionStatus === 'error' ? snapshot.status.message || 'Connection failed' : '';
  main.hidden = false;
}

async function closeConnected() {
  if (closing) return;
  closing = true;
  const result = await roundo.execute({ version: 1, command: 'ui.back', arguments: {} });
  if (!result.ok) {
    closing = false;
    detail.textContent = result.error?.message || 'Unable to close connection view';
  }
}

async function retry() {
  if (commandPending || closing) return;
  setPending(true);
  try {
    const result = await roundo.execute({ version: 1, command: 'server.retry', arguments: {} });
    if (!result.ok) detail.textContent = result.error?.message || 'Unable to retry connection';
  } finally {
    setPending(false);
  }
}

async function disconnect() {
  if (commandPending || closing) return;
  setPending(true);
  try {
    const result = await roundo.execute({ version: 1, command: 'server.disconnect', arguments: {} });
    if (!result.ok) {
      detail.textContent = result.error?.message || 'Unable to cancel connection';
      return;
    }
    closing = true;
    const closed = await roundo.execute({ version: 1, command: 'ui.back', arguments: {} });
    if (!closed.ok) {
      closing = false;
      detail.textContent = closed.error?.message || 'Unable to close connection view';
    }
  } finally {
    setPending(false);
  }
}

retryButton.addEventListener('click', retry);
disconnectButton.addEventListener('click', disconnect);
roundo.subscribe('client.connection', receiveStatus);
</script>
</body>
</html>
