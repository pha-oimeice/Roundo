title = "物品实例"
sources = { debug = "client.debug" }
session_source = "debug"
[model]
inventories = {}
snapshot = {}
receipt = {}
created = {}
selected = ""
selected_item = {}
offset = 0
history = []
confirm = false
placement_enabled = false
destruction_enabled = false
placement_reach = ""
destruction_reach = ""
[shortcuts]
"roundo.debug" = [{ kind = "command", name = "ui.back", arguments = {} }]

[[nodes]]
id = "page"
kind = "column"
style = { width = "100%", height = "100%", padding = 24.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children]]
id = "heading"
kind = "text"
text = "物品实例创建 / 删除"
style = { font_size = 28.0 }
[[nodes.children]]
id = "notice"
kind = "text"
text = "创建新实例并装配明确选择的来源，不修改已有物品。删除使用所选实例的诊断选择器，不将业务 ID 当作实例授权。"
[[nodes.children]]
id = "scroll"
kind = "scroll"
scrollbar_width = 8.0
style = { flex_grow = 1.0, min_height = 0.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children.children]]
id = "read"
kind = "button"
text = "读取物品栏第一页"
on_activate = [{ kind = "debug", operation = { inventory = { list = { body = { op = "null" }, offset = 0 } } }, save = "model.receipt" }, { kind = "set", path = "model.inventories", value = "$result.inventories" }]
[[nodes.children.children]]
id = "inventories"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.inventories" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children]]
id = "counts"
kind = "text"
text = "共 ${model.inventories.total} 个物品栏；索引截断 ${model.inventories.truncated}。未列出的物品栏不能判定为不存在。"
[[nodes.children.children.children]]
id = "selection"
kind = "select"
max_visible = 8
value = "$model.selected"
bind = "model.selected"
options = { op = "options", items = "$model.inventories.inventories", alias = "option", value = "$option.inventory", label = "${option.inventory} · ${option.owner.body} · ${option.owner.roles} · Public ${option.is_public} · ${option.item_count} 件" }
on_change = [
    { kind = "set", path = "model.snapshot", value = {} },
    { kind = "set", path = "model.selected_item", value = {} },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
    { kind = "debug", operation = { item = { list = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.items" },
]
[[nodes.children.children.children]]
id = "next"
kind = "button"
text = "下一页物品栏"
enabled = { op = "ne", left = "$model.inventories.next_offset", right = { op = "null" } }
on_activate = [{ kind = "debug", operation = { inventory = { list = { body = { op = "null" }, offset = "$model.inventories.next_offset" } } }, save = "model.receipt" }, { kind = "set", path = "model.inventories", value = "$result.inventories" }]
[[nodes.children.children]]
id = "items"
kind = "column"
visible = { op = "ne", left = "$model.selected", right = "" }
style = { row_gap = 8.0, column_gap = 8.0, padding = 12.0, background = [23, 35, 51, 255] }
[[nodes.children.children.children]]
id = "selection"
kind = "text"
text = "所选物品栏：${model.selected}"
[[nodes.children.children.children]]
id = "refresh"
kind = "button"
text = "重新读取直接成员（第一页）"
on_activate = [
    { kind = "set", path = "model.selected_item", value = {} },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "debug", operation = { item = { list = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.items" },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children.children]]
id = "snapshot"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.snapshot" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children.children]]
id = "owner"
kind = "text"
text = { op = "json", value = "$model.snapshot.inventory" }
[[nodes.children.children.children.children]]
id = "count"
kind = "text"
text = "服务端快照 · 直接成员总计 ${model.snapshot.total_items} 件；分页不保证同一时刻。"
[[nodes.children.children.children.children]]
id = "list"
kind = "repeat"
items = "$model.snapshot.items"
alias = "item"
key = "$item.selector"
[[nodes.children.children.children.children.children]]
id = "select"
kind = "button"
text = "物品 ID：${item.item}"
on_activate = [{ kind = "set", path = "model.selected_item", value = "$item" }, { kind = "set", path = "model.confirm", value = false }]
[[nodes.children.children.children.children]]
id = "next"
kind = "button"
text = "下一页物品"
enabled = { op = "ne", left = "$model.snapshot.next_offset", right = { op = "null" } }
on_activate = [
    { kind = "set", path = "model.history", value = { op = "append", values = "$model.history", value = "$model.offset" } },
    { kind = "set", path = "model.offset", value = "$model.snapshot.next_offset" },
    { kind = "set", path = "model.selected_item", value = {} },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "debug", operation = { item = { list = { inventory = "$model.selected", offset = "$model.offset" } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.items" },
]
[[nodes.children.children.children.children]]
id = "previous"
kind = "button"
text = "上一页物品"
enabled = { op = "ne", left = { op = "length", value = "$model.history" }, right = 0 }
on_activate = [
    { kind = "set", path = "model.offset", value = { op = "last", value = "$model.history" } },
    { kind = "set", path = "model.history", value = { op = "init", value = "$model.history" } },
    { kind = "set", path = "model.selected_item", value = {} },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "debug", operation = { item = { list = { inventory = "$model.selected", offset = "$model.offset" } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.items" },
]
[[nodes.children.children.children]]
id = "delete"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.selected_item" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children.children]]
id = "selected"
kind = "text"
text = "删除目标业务 ID：${model.selected_item.item}（操作绑定所选确切实例）"
[[nodes.children.children.children.children]]
id = "confirm"
kind = "checkbox"
text = "确认删除所选物品实例"
value = "$model.confirm"
bind = "model.confirm"
[[nodes.children.children.children.children]]
id = "remove"
kind = "button"
text = "删除所选实例"
enabled = "$model.confirm"
on_activate = [
    { kind = "debug", operation = { item = { remove = { inventory = "$model.selected", selector = "$model.selected_item.selector" } } }, save = "model.receipt" },
    { kind = "require", condition = { op = "and", values = [{ op = "eq", left = "$result.item_removed.selector", right = "$model.selected_item.selector" }, { op = "eq", left = "$result.item_removed.item", right = "$model.selected_item.item" }] }, message = "未收到匹配的删除完成回执；请刷新核实，不要重复提交。" },
    { kind = "set", path = "model.selected_item", value = {} },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "set", path = "model.snapshot", value = {} },
    { kind = "debug", operation = { item = { list = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.items" },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children.children]]
id = "create-heading"
kind = "text"
text = "向所选已有物品栏创建新物品实例"
style = { font_size = 24.0 }
[[nodes.children.children.children]]
id = "placement-enabled"
kind = "checkbox"
text = "装配方块放置功能"
value = "$model.placement_enabled"
bind = "model.placement_enabled"
[[nodes.children.children.children]]
id = "placement-label"
kind = "text"
text = "放置距离（启用后必须填写有限正数，不设默认距离）"
[[nodes.children.children.children]]
id = "placement"
kind = "text-input"
value = "$model.placement_reach"
bind = "model.placement_reach"
enabled = "$model.placement_enabled"
[[nodes.children.children.children]]
id = "destruction-enabled"
kind = "checkbox"
text = "装配方块破坏功能"
value = "$model.destruction_enabled"
bind = "model.destruction_enabled"
[[nodes.children.children.children]]
id = "destruction-label"
kind = "text"
text = "破坏距离（启用后必须填写有限正数，不设默认距离）"
[[nodes.children.children.children]]
id = "destruction"
kind = "text-input"
value = "$model.destruction_reach"
bind = "model.destruction_reach"
enabled = "$model.destruction_enabled"
[[nodes.children.children.children]]
id = "create"
kind = "button"
text = "创建新实例并回读"
on_activate = [
    { kind = "debug", operation = { create_item = { inventory = "$model.selected", placement_reach = { op = "if", condition = "$model.placement_enabled", then = { op = "parse-number", value = "$model.placement_reach" }, else = { op = "null" } }, destruction_reach = { op = "if", condition = "$model.destruction_enabled", then = { op = "parse-number", value = "$model.destruction_reach" }, else = { op = "null" } } } }, save = "model.receipt" },
    { kind = "set", path = "model.created", value = "$result.item_created" },
    { kind = "debug", operation = { item = { list = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.items" },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children.children]]
id = "created"
kind = "text"
visible = { op = "ne", left = { op = "length", value = "$model.created" }, right = 0 }
text = { op = "json", value = "$model.created" }
[[nodes.children]]
id = "busy"
kind = "text"
text = "等待服务端完成回执…"
visible = "$busy"
[[nodes.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
[[nodes.children]]
id = "back"
kind = "button"
text = "返回目录 / Esc"
on_activate = [{ kind = "command", name = "ui.back", arguments = {} }]
