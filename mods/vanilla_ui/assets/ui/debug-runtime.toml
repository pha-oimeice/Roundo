title = "运行状态"
sources = { connection = "client.connection", controls = "client.control", hud = "client.hud", debug = "client.debug" }
model = {}
[shortcuts]
"roundo.debug" = [{ kind = "command", name = "ui.back", arguments = {} }]

[[nodes]]
id = "page"
kind = "column"
style = { width = "100%", height = "100%", padding = 24.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children]]
id = "heading"
kind = "text"
text = "运行状态 · 当前客户端只读快照"
style = { font_size = 28.0 }
[[nodes.children]]
id = "scroll"
kind = "scroll"
scrollbar_width = 8.0
style = { flex_grow = 1.0, min_height = 0.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children.children]]
id = "connection"
kind = "text"
text = { op = "json", value = "$data.connection" }
[[nodes.children.children]]
id = "controls"
kind = "text"
text = { op = "json", value = "$data.controls" }
[[nodes.children.children]]
id = "hud"
kind = "text"
text = { op = "json", value = "$data.hud" }
[[nodes.children.children]]
id = "debug"
kind = "text"
text = { op = "json", value = "$data.debug" }
[[nodes.children]]
id = "back"
kind = "button"
text = "返回目录 / Esc"
on_activate = [{ kind = "command", name = "ui.back", arguments = {} }]
