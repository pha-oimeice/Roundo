title = "物品栏与保管关系"
sources = { debug = "client.debug" }
session_source = "debug"
[model]
objects = {}
inventories = {}
targets = {}
snapshot = {}
receipt = {}
owner = ""
create_owner = ""
selected = ""
item = ""
target = ""
offset = 0
history = []
confirm = false
[shortcuts]
"roundo.debug" = [{ kind = "command", name = "ui.back", arguments = {} }]

[[nodes]]
id = "page"
kind = "column"
style = { width = "100%", height = "100%", padding = 24.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children]]
id = "heading"
kind = "text"
text = "物品栏与保管关系"
style = { font_size = 28.0 }
[[nodes.children]]
id = "notice"
kind = "text"
text = "保管关系不等于物品数据访问权。转入 Public 不会生成空间掉落物。Public 属于世界设施，不能单独删除或另建物品栏。"
[[nodes.children]]
id = "scroll"
kind = "scroll"
scrollbar_width = 8.0
style = { flex_grow = 1.0, min_height = 0.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children.children]]
id = "read"
kind = "button"
text = "读取概念体与物品栏第一页"
on_activate = [
    { kind = "debug", operation = { list = { offset = 0 } }, save = "model.receipt" },
    { kind = "set", path = "model.objects", value = "$result.objects" },
    { kind = "debug", operation = { inventory = { list = { body = { op = "if", condition = { op = "eq", left = "$model.owner", right = "" }, then = { op = "null" }, else = "$model.owner" }, offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.inventories", value = "$result.inventories" },
]
[[nodes.children.children]]
id = "owners"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.objects" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children]]
id = "counts"
kind = "text"
text = "概念体总数 ${model.objects.total_bodies}；诊断索引截断 ${model.objects.truncated}。未列出不能判定不存在。"
[[nodes.children.children.children]]
id = "filter"
kind = "select"
max_visible = 8
value = "$model.owner"
bind = "model.owner"
options = { op = "options", items = "$model.objects.body_summaries", alias = "owner", value = "$owner.body", label = "${owner.body} · ${owner.roles} · Public ${owner.is_public}" }
[[nodes.children.children.children]]
id = "filter-query"
kind = "button"
text = "按所选概念体查询物品栏"
on_activate = [{ kind = "debug", operation = { inventory = { list = { body = "$model.owner", offset = 0 } } }, save = "model.receipt" }, { kind = "set", path = "model.inventories", value = "$result.inventories" }]
[[nodes.children.children.children]]
id = "clear-filter"
kind = "button"
text = "清除过滤并查询所有物品栏"
on_activate = [{ kind = "set", path = "model.owner", value = "" }, { kind = "debug", operation = { inventory = { list = { body = { op = "null" }, offset = 0 } } }, save = "model.receipt" }, { kind = "set", path = "model.inventories", value = "$result.inventories" }]
[[nodes.children.children.children]]
id = "more"
kind = "button"
text = "下一页概念体"
enabled = { op = "ne", left = "$model.objects.next_offset", right = { op = "null" } }
on_activate = [{ kind = "debug", operation = { list = { offset = "$model.objects.next_offset" } }, save = "model.receipt" }, { kind = "set", path = "model.objects", value = "$result.objects" }]
[[nodes.children.children.children]]
id = "create-owner"
kind = "select"
max_visible = 8
value = "$model.create_owner"
bind = "model.create_owner"
options = { op = "options", items = "$model.objects.body_summaries", alias = "owner", value = "$owner.body", label = "${owner.body} · ${owner.roles}", filter = { op = "not", value = "$owner.is_public" } }
[[nodes.children.children.children]]
id = "create"
kind = "button"
text = "为所选非 Public 概念体创建独立空物品栏"
enabled = { op = "ne", left = "$model.create_owner", right = "" }
on_activate = [
    { kind = "debug", operation = { inventory = { create = { body = "$model.create_owner" } } }, save = "model.receipt" },
    { kind = "set", path = "model.selected", value = "$result.inventory_created.inventory" },
    { kind = "debug", operation = { inventory = { inspect = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.inventory" },
    { kind = "set", path = "model.item", value = "" },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children]]
id = "inventories"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.inventories" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children]]
id = "counts"
kind = "text"
text = "当前查询总计 ${model.inventories.total} 个物品栏；索引截断 ${model.inventories.truncated}。"
[[nodes.children.children.children]]
id = "list"
kind = "repeat"
items = "$model.inventories.inventories"
alias = "inventory"
key = "$inventory.inventory"
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children.children]]
id = "inspect"
kind = "button"
text = "${inventory.inventory} · 所属 ${inventory.owner.body} · ${inventory.owner.roles} · Public ${inventory.is_public} · 直接成员 ${inventory.item_count}"
on_activate = [
    { kind = "debug", operation = { inventory = { inspect = { inventory = "$inventory.inventory", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.selected", value = "$inventory.inventory" },
    { kind = "set", path = "model.snapshot", value = "$result.inventory" },
    { kind = "set", path = "model.item", value = "" },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children.children]]
id = "next"
kind = "button"
text = "下一页物品栏"
enabled = { op = "ne", left = "$model.inventories.next_offset", right = { op = "null" } }
on_activate = [{ kind = "debug", operation = { inventory = { list = { body = { op = "if", condition = { op = "eq", left = "$model.owner", right = "" }, then = { op = "null" }, else = "$model.owner" }, offset = "$model.inventories.next_offset" } } }, save = "model.receipt" }, { kind = "set", path = "model.inventories", value = "$result.inventories" }]
[[nodes.children.children]]
id = "detail"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.snapshot" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0, padding = 12.0, background = [23, 35, 51, 255] }
[[nodes.children.children.children]]
id = "identity"
kind = "text"
text = { op = "json", value = "$model.snapshot.summary" }
[[nodes.children.children.children]]
id = "count"
kind = "text"
text = "直接成员总数 ${model.snapshot.total_items}。仅展示 ID，不推断物品名称或类型；分页不保证同一时刻。"
[[nodes.children.children.children]]
id = "refresh"
kind = "button"
text = "重新读取所选物品栏（第一页）"
on_activate = [{ kind = "debug", operation = { inventory = { inspect = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" }, { kind = "set", path = "model.snapshot", value = "$result.inventory" }, { kind = "set", path = "model.item", value = "" }, { kind = "set", path = "model.confirm", value = false }, { kind = "set", path = "model.offset", value = 0 }, { kind = "set", path = "model.history", value = [] }]
[[nodes.children.children.children]]
id = "items"
kind = "repeat"
items = "$model.snapshot.items"
alias = "item"
key = "$item"
[[nodes.children.children.children.children]]
id = "select"
kind = "button"
text = "$item"
on_activate = [{ kind = "set", path = "model.item", value = "$item" }]
[[nodes.children.children.children]]
id = "next"
kind = "button"
text = "下一页成员"
enabled = { op = "ne", left = "$model.snapshot.next_offset", right = { op = "null" } }
on_activate = [
    { kind = "set", path = "model.history", value = { op = "append", values = "$model.history", value = "$model.offset" } },
    { kind = "set", path = "model.offset", value = "$model.snapshot.next_offset" },
    { kind = "set", path = "model.item", value = "" },
    { kind = "debug", operation = { inventory = { inspect = { inventory = "$model.selected", offset = "$model.offset" } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.inventory" },
]
[[nodes.children.children.children]]
id = "previous"
kind = "button"
text = "上一页成员"
enabled = { op = "ne", left = { op = "length", value = "$model.history" }, right = 0 }
on_activate = [
    { kind = "set", path = "model.offset", value = { op = "last", value = "$model.history" } },
    { kind = "set", path = "model.history", value = { op = "init", value = "$model.history" } },
    { kind = "set", path = "model.item", value = "" },
    { kind = "debug", operation = { inventory = { inspect = { inventory = "$model.selected", offset = "$model.offset" } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.inventory" },
]
[[nodes.children.children.children]]
id = "selected-item"
kind = "text"
text = "所选直接成员：${model.item}"
[[nodes.children.children.children]]
id = "load-targets"
kind = "button"
text = "读取目标物品栏第一页（全部概念体）"
on_activate = [{ kind = "debug", operation = { inventory = { list = { body = { op = "null" }, offset = 0 } } }, save = "model.receipt" }, { kind = "set", path = "model.targets", value = "$result.inventories" }, { kind = "set", path = "model.target", value = "" }]
[[nodes.children.children.children]]
id = "targets"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.targets" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children.children]]
id = "target"
kind = "select"
max_visible = 8
value = "$model.target"
bind = "model.target"
options = { op = "options", items = "$model.targets.inventories", alias = "option", value = "$option.inventory", label = "${option.inventory} · ${option.owner.body} · Public ${option.is_public}", filter = { op = "ne", left = "$option.inventory", right = "$model.selected" } }
[[nodes.children.children.children.children]]
id = "next"
kind = "button"
text = "下一页目标物品栏"
enabled = { op = "ne", left = "$model.targets.next_offset", right = { op = "null" } }
on_activate = [{ kind = "debug", operation = { inventory = { list = { body = { op = "null" }, offset = "$model.targets.next_offset" } } }, save = "model.receipt" }, { kind = "set", path = "model.targets", value = "$result.inventories" }, { kind = "set", path = "model.target", value = "" }]
[[nodes.children.children.children.children]]
id = "transfer"
kind = "button"
text = "将所选直接成员转入目标物品栏"
enabled = { op = "and", values = [{ op = "ne", left = "$model.item", right = "" }, { op = "ne", left = "$model.target", right = "" }] }
on_activate = [
    { kind = "debug", operation = { inventory = { transfer = { source = "$model.selected", target = "$model.target", item = "$model.item" } } }, save = "model.receipt" },
    { kind = "set", path = "model.item", value = "" },
    { kind = "debug", operation = { inventory = { inspect = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.inventory" },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children.children]]
id = "spill"
kind = "button"
text = "将所选直接成员转入 Public（不产生掉落物）"
enabled = { op = "and", values = [{ op = "ne", left = "$model.item", right = "" }, { op = "not", value = "$model.snapshot.summary.is_public" }] }
on_activate = [
    { kind = "debug", operation = { inventory = { spill = { inventory = "$model.selected", item = "$model.item" } } }, save = "model.receipt" },
    { kind = "set", path = "model.item", value = "" },
    { kind = "debug", operation = { inventory = { inspect = { inventory = "$model.selected", offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = "$result.inventory" },
    { kind = "set", path = "model.offset", value = 0 },
    { kind = "set", path = "model.history", value = [] },
]
[[nodes.children.children.children]]
id = "confirm"
kind = "checkbox"
text = "确认删除此物品栏；直接成员转入 Public，所属概念体和物品保留"
value = "$model.confirm"
bind = "model.confirm"
enabled = { op = "not", value = "$model.snapshot.summary.is_public" }
[[nodes.children.children.children]]
id = "remove"
kind = "button"
text = "删除所选非 Public 物品栏"
enabled = { op = "and", values = ["$model.confirm", { op = "not", value = "$model.snapshot.summary.is_public" }] }
on_activate = [
    { kind = "debug", operation = { inventory = { remove = { inventory = "$model.selected" } } }, save = "model.receipt" },
    { kind = "set", path = "model.snapshot", value = {} },
    { kind = "set", path = "model.selected", value = "" },
    { kind = "set", path = "model.item", value = "" },
    { kind = "set", path = "model.confirm", value = false },
    { kind = "debug", operation = { inventory = { list = { body = { op = "null" }, offset = 0 } } }, save = "model.receipt" },
    { kind = "set", path = "model.inventories", value = "$result.inventories" },
]
[[nodes.children]]
id = "busy"
kind = "text"
text = "等待服务端完成回执…"
visible = "$busy"
[[nodes.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
[[nodes.children]]
id = "back"
kind = "button"
text = "返回目录 / Esc"
on_activate = [{ kind = "command", name = "ui.back", arguments = {} }]
