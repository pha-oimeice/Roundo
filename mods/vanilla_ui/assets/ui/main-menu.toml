title = "Roundo"
sources = {}
model = { intro = true }
on_open = [{ kind = "wait", seconds = 2.4 }, { kind = "set", path = "model.intro", value = false }]

[[nodes]]
id = "menu"
kind = "column"
style = { width = "100%", height = "100%", align_items = "Center", justify_content = "Center", row_gap = 12.0, column_gap = 12.0 }
[[nodes.children]]
id = "title"
kind = "text"
text = "ROUNDO"
style = { font_size = 72.0, color = [244, 247, 251, 255] }
[[nodes.children]]
id = "settings"
kind = "button"
text = "设置"
visible = { op = "not", value = "$model.intro" }
style = { width = 260.0 }
on_activate = [{ kind = "command", name = "ui.open", arguments = { import = "settings" } }]
[[nodes.children]]
id = "quit"
kind = "button"
text = "退出"
visible = { op = "not", value = "$model.intro" }
style = { width = 260.0 }
on_activate = [{ kind = "command", name = "app.quit", arguments = {} }]
[[nodes.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
