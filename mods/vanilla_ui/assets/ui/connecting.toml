title = "连接"
sources = { connection = "client.connection" }
model = {}
[shortcuts]
"roundo.debug" = [{ kind = "command", name = "ui.open", arguments = { import = "debug" } }]

[[nodes]]
id = "page"
kind = "column"
style = { width = "100%", height = "100%", align_items = "Center", justify_content = "Center", row_gap = 16.0, column_gap = 16.0 }
[[nodes.children]]
id = "heading"
kind = "text"
text = "连接状态：${data.connection.status.status}"
style = { font_size = 28.0 }
[[nodes.children]]
id = "server"
kind = "text"
text = "${data.connection.server.name} · ${data.connection.server.address}"
[[nodes.children]]
id = "detail"
kind = "text"
text = { op = "json", value = "$data.connection.status" }
[[nodes.children]]
id = "retry"
kind = "button"
text = "重试连接"
visible = { op = "eq", left = "$data.connection.status.status", right = "error" }
on_activate = [{ kind = "command", name = "server.retry", arguments = {} }]
[[nodes.children]]
id = "disconnect"
kind = "button"
text = "取消"
on_activate = [{ kind = "command", name = "server.disconnect", arguments = {} }, { kind = "command", name = "ui.back", arguments = {} }]
[[nodes.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
