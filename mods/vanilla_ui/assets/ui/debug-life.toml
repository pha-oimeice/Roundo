title = "概念体与生命体"
sources = { debug = "client.debug" }
session_source = "debug"
[model]
objects = {}
body = {}
receipt = {}
selected = ""
life = ""
data_type = ""
relation_action = ""
values = { health = 0, intent = 0, execution = 0, record = 0, continuity = 0.0, change = 0.0, cycle = 0.0, eternity = 0.0 }
[shortcuts]
"roundo.debug" = [{ kind = "command", name = "ui.back", arguments = {} }]

[[nodes]]
id = "page"
kind = "column"
style = { width = "100%", height = "100%", padding = 24.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children]]
id = "heading"
kind = "text"
text = "概念体 / 生命体 / 数据协作"
style = { font_size = 28.0 }
[[nodes.children]]
id = "notice"
kind = "text"
text = "角色与配方关联来自服务端当前快照，不由编号或属性推断。声明、批准、注册是不同操作；不会自动补齐缺失接口。"
[[nodes.children]]
id = "scroll"
kind = "scroll"
scrollbar_width = 8.0
style = { flex_grow = 1.0, min_height = 0.0, row_gap = 12.0, column_gap = 12.0 }
[[nodes.children.children]]
id = "refresh"
kind = "button"
text = "读取对象列表（第一页）"
on_activate = [{ kind = "debug", operation = { list = { offset = 0 } }, save = "model.receipt" }, { kind = "set", path = "model.objects", value = "$result.objects" }]
[[nodes.children.children]]
id = "objects"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.objects" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children]]
id = "counts"
kind = "text"
text = "服务端共 ${model.objects.total_bodies} 个概念体、${model.objects.total_lives} 个生命体；截断标记 ${model.objects.truncated}。未列出不代表不存在。"
[[nodes.children.children.children]]
id = "bodies"
kind = "repeat"
items = "$model.objects.body_summaries"
alias = "body"
key = "$body.body"
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children.children]]
id = "inspect"
kind = "button"
text = "${body.body} · 原生角色 ${body.roles} · Public ${body.is_public} · 配方关联 ${body.recipe_life}"
on_activate = [
    { kind = "debug", operation = { inspect = { body = "$body.body" } }, save = "model.receipt" },
    { kind = "set", path = "model.selected", value = "$body.body" },
    { kind = "set", path = "model.body", value = "$result.body" },
]
[[nodes.children.children.children]]
id = "next"
kind = "button"
text = "下一页对象"
enabled = { op = "ne", left = "$model.objects.next_offset", right = { op = "null" } }
on_activate = [{ kind = "debug", operation = { list = { offset = "$model.objects.next_offset" } }, save = "model.receipt" }, { kind = "set", path = "model.objects", value = "$result.objects" }]
[[nodes.children.children]]
id = "selection"
kind = "column"
visible = { op = "ne", left = "$model.selected", right = "" }
style = { row_gap = 8.0, column_gap = 8.0, padding = 12.0, background = [23, 35, 51, 255] }
[[nodes.children.children.children]]
id = "identity"
kind = "text"
text = { op = "json", value = "$model.body.summary" }
[[nodes.children.children.children]]
id = "refresh"
kind = "button"
text = "重新读取所选概念体"
on_activate = [{ kind = "debug", operation = { inspect = { body = "$model.selected" } }, save = "model.receipt" }, { kind = "set", path = "model.body", value = "$result.body" }]
[[nodes.children.children.children]]
id = "attributes"
kind = "repeat"
items = "$model.body.attributes"
alias = "attribute"
key = "$attribute.id"
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children.children]]
id = "row"
kind = "row"
style = { row_gap = 12.0, column_gap = 12.0, align_items = "Center" }
[[nodes.children.children.children.children.children]]
id = "name"
kind = "text"
text = "${attribute.name} · writable ${attribute.writable} · ${attribute.value}"
style = { width = 420.0 }
[[nodes.children.children.children.children.children]]
id = "integer"
kind = "number-input"
integer = true
visible = { op = "and", values = ["$attribute.writable", { op = "ne", left = { op = "get", value = "$attribute.value", key = "integer" }, right = { op = "null" } }] }
value = { op = "get", value = "$attribute.value", key = "integer" }
min = -2147483648
max = 2147483647
step = 1
style = { width = 220.0 }
on_change = [{ kind = "debug", operation = { set_attribute = { body = "$model.selected", attribute = "$attribute.id", value = { integer = "$event" } } }, save = "model.receipt" }, { kind = "debug", operation = { inspect = { body = "$model.selected" } }, save = "model.receipt" }, { kind = "set", path = "model.body", value = "$result.body" }]
[[nodes.children.children.children.children.children]]
id = "unorm"
kind = "number-input"
integer = false
visible = { op = "and", values = ["$attribute.writable", { op = "ne", left = { op = "get", value = "$attribute.value", key = "unorm" }, right = { op = "null" } }] }
value = { op = "get", value = "$attribute.value", key = "unorm" }
min = 0.0
max = 1.0
style = { width = 220.0 }
on_change = [{ kind = "debug", operation = { set_attribute = { body = "$model.selected", attribute = "$attribute.id", value = { unorm = "$event" } } }, save = "model.receipt" }, { kind = "debug", operation = { inspect = { body = "$model.selected" } }, save = "model.receipt" }, { kind = "set", path = "model.body", value = "$result.body" }]
[[nodes.children.children.children]]
id = "relations"
kind = "text"
text = { op = "json", value = "$model.body.relations" }
[[nodes.children.children.children]]
id = "truncation"
kind = "text"
text = "关系快照已截断；未展示的关系不能判定为不存在。"
visible = "$model.body.relations_truncated"
[[nodes.children.children]]
id = "relations-editor"
kind = "column"
visible = { op = "ne", left = { op = "length", value = "$model.objects" }, right = 0 }
style = { row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children.children]]
id = "life-label"
kind = "text"
text = "生命体（协作空间，不代表独占归属）"
[[nodes.children.children.children]]
id = "life"
kind = "select"
max_visible = 8
value = "$model.life"
bind = "model.life"
options = { op = "options", items = "$model.objects.lives", alias = "option", value = "$option", label = "$option" }
[[nodes.children.children.children]]
id = "data-label"
kind = "text"
text = "数据接口（State 来源固定；Event 不保证有人执行）"
[[nodes.children.children.children]]
id = "data"
kind = "select"
max_visible = 8
value = "$model.data_type"
bind = "model.data_type"
options = { op = "options", items = "$model.objects.data_types", alias = "option", value = "$option.key", label = "${option.key} · ${option.shape}" }
[[nodes.children.children.children]]
id = "action"
kind = "select"
max_visible = 9
value = "$model.relation_action"
bind = "model.relation_action"
options = [
    { value = "declare_reader", label = "声明读取资格（不授予批准、不接通）" },
    { value = "declare_writer", label = "声明写入资格（不创建状态、不接通）" },
    { value = "approve_reader", label = "批准读取（仍未注册读取）" },
    { value = "approve_writer", label = "批准写入（不更换状态来源、不接通）" },
    { value = "register_reader", label = "注册读取（须满足声明、批准和接口要求）" },
    { value = "register_writer", label = "注册写入 / 重接原状态来源" },
    { value = "unregister_reader", label = "注销读取（保留声明与批准）" },
    { value = "unregister_writer", label = "注销写入（不撤回已接受事件，保留状态和读取者）" },
    { value = "create_slot", label = "创建不存在的空状态并接通写入（固定原始来源）" },
]
[[nodes.children.children.children]]
id = "apply"
kind = "button"
text = "仅执行所选步骤，并重新读取概念体"
enabled = { op = "and", values = [{ op = "ne", left = "$model.selected", right = "" }, { op = "ne", left = "$model.life", right = "" }, { op = "ne", left = "$model.data_type", right = "" }, { op = "ne", left = "$model.relation_action", right = "" }] }
on_activate = [
    { kind = "debug", operation = { relation = { body = "$model.selected", life = "$model.life", data_type = "$model.data_type", action = "$model.relation_action" } }, save = "model.receipt" },
    { kind = "debug", operation = { inspect = { body = "$model.selected" } }, save = "model.receipt" },
    { kind = "set", path = "model.body", value = "$result.body" },
]
[[nodes.children.children]]
id = "create-heading"
kind = "text"
text = "创建概念体：基础属性不会赋予角色或行为"
style = { font_size = 24.0 }
[[nodes.children.children]]
id = "health-label"
kind = "text"
text = "health / 生命值"
[[nodes.children.children]]
id = "health"
kind = "number-input"
integer = true
value = "$model.values.health"
bind = "model.values.health"
min = -2147483648
max = 2147483647
step = 1
[[nodes.children.children]]
id = "intent-label"
kind = "text"
text = "intent / 意图值"
[[nodes.children.children]]
id = "intent"
kind = "number-input"
integer = true
value = "$model.values.intent"
bind = "model.values.intent"
min = -2147483648
max = 2147483647
step = 1
[[nodes.children.children]]
id = "execution-label"
kind = "text"
text = "execution / 执行值"
[[nodes.children.children]]
id = "execution"
kind = "number-input"
integer = true
value = "$model.values.execution"
bind = "model.values.execution"
min = -2147483648
max = 2147483647
step = 1
[[nodes.children.children]]
id = "record-label"
kind = "text"
text = "record / 记录值"
[[nodes.children.children]]
id = "record"
kind = "number-input"
integer = true
value = "$model.values.record"
bind = "model.values.record"
min = -2147483648
max = 2147483647
step = 1
[[nodes.children.children]]
id = "continuity-label"
kind = "text"
text = "continuity / 连续率"
[[nodes.children.children]]
id = "continuity"
kind = "number-input"
integer = false
value = "$model.values.continuity"
bind = "model.values.continuity"
min = 0.0
max = 1.0
[[nodes.children.children]]
id = "change-label"
kind = "text"
text = "change / 变化率"
[[nodes.children.children]]
id = "change"
kind = "number-input"
integer = false
value = "$model.values.change"
bind = "model.values.change"
min = 0.0
max = 1.0
[[nodes.children.children]]
id = "cycle-label"
kind = "text"
text = "cycle / 周期率"
[[nodes.children.children]]
id = "cycle"
kind = "number-input"
integer = false
value = "$model.values.cycle"
bind = "model.values.cycle"
min = 0.0
max = 1.0
[[nodes.children.children]]
id = "eternity-label"
kind = "text"
text = "eternity / 永恒率"
[[nodes.children.children]]
id = "eternity"
kind = "number-input"
integer = false
value = "$model.values.eternity"
bind = "model.values.eternity"
min = 0.0
max = 1.0
[[nodes.children.children]]
id = "create-body"
kind = "button"
text = "创建概念体并读取"
on_activate = [
    { kind = "debug", operation = { create_body = { values = "$model.values" } }, save = "model.receipt" },
    { kind = "set", path = "model.selected", value = "$result.created.body" },
    { kind = "debug", operation = { inspect = { body = "$model.selected" } }, save = "model.receipt" },
    { kind = "set", path = "model.body", value = "$result.body" },
]
[[nodes.children.children]]
id = "create-life"
kind = "button"
text = "创建生命体（预设接入规则，无参与者、无状态存储）"
on_activate = [
    { kind = "debug", operation = "create_life", save = "model.receipt" },
    { kind = "set", path = "model.life", value = "$result.created.life" },
    { kind = "debug", operation = { list = { offset = 0 } }, save = "model.receipt" },
    { kind = "set", path = "model.objects", value = "$result.objects" },
]
[[nodes.children]]
id = "busy"
kind = "text"
text = "等待服务端完成回执…"
visible = "$busy"
[[nodes.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
[[nodes.children]]
id = "back"
kind = "button"
text = "返回目录 / Esc"
on_activate = [{ kind = "command", name = "ui.back", arguments = {} }]
