title = "HUD"
sources = { hud = "client.hud", controls = "client.control", bindings = "client.bindings" }
model = {}
[shortcuts]
"roundo.inventory" = [{ kind = "command", name = "ui.open", arguments = { import = "inventory" } }]
"roundo.debug" = [{ kind = "command", name = "ui.open", arguments = { import = "debug" } }]

[[nodes]]
id = "hud"
kind = "column"
style = { width = "100%", height = "100%", padding = 12.0, color = [255, 255, 255, 255] }
[[nodes.children]]
id = "stats"
kind = "text"
text = "FPS ${data.hud.fps.current} · avg ${data.hud.fps.average} · min ${data.hud.fps.min} · max ${data.hud.fps.max}\nPosition ${data.hud.position.absolute}\nVoxel ${data.hud.position.chunk_relative}"
style = { font_size = 14.0, color = [255, 255, 255, 255] }
[[nodes.children]]
id = "crosshair"
kind = "text"
text = "+"
style = { position_type = "Absolute", left = "50%", top = "50%", font_size = 28.0, color = [255, 255, 255, 255] }
[[nodes.children]]
id = "target"
kind = "text"
text = { op = "json", value = "$data.hud.target" }
visible = { op = "ne", left = "$data.hud.target", right = { op = "null" } }
style = { position_type = "Absolute", right = 12.0, bottom = 12.0, font_size = 14.0, color = [255, 255, 255, 255] }
[[nodes.children]]
id = "hints"
kind = "column"
style = { position_type = "Absolute", left = 12.0, bottom = 12.0, row_gap = 8.0, column_gap = 8.0 }
[[nodes.children.children]]
id = "inventory"
kind = "text"
text = { op = "shortcuts", bindings = "$data.bindings", function = "roundo.inventory" }
style = { color = [204, 221, 235, 255] }
[[nodes.children.children]]
id = "hint-label"
kind = "text"
text = "物品栏 · 快捷键可在设置中修改"
style = { color = [204, 221, 235, 255] }
[[nodes.children.children]]
id = "controls"
kind = "repeat"
items = "$data.controls.controls"
alias = "control"
key = "$control.controller_id"
[[nodes.children.children.children]]
id = "control"
kind = "text"
text = "Controller ${control.controller_id}: ${control.state}（可在暂停菜单中重试失败的控制器）"
style = { font_size = 14.0, color = [255, 255, 255, 255] }
[[nodes.children.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
