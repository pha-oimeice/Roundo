title = "HUD"
sources = { hud = "client.hud" }
model = {}

[[nodes]]
id = "hud"
kind = "column"
style = { width = "100%", height = "100%", padding = 12.0, color = [255, 255, 255, 255] }
[[nodes.children]]
id = "stats"
kind = "text"
text = "FPS ${data.hud.fps.current} · avg ${data.hud.fps.average} · min ${data.hud.fps.min} · max ${data.hud.fps.max}\nPosition ${data.hud.position.absolute}\nVoxel ${data.hud.position.chunk_relative}"
style = { font_size = 14.0, color = [255, 255, 255, 255] }
[[nodes.children]]
id = "error"
kind = "text"
text = "$error"
style = { color = [255, 155, 155, 255] }
