# Native UI Resource Type. Networking-dependent views are not installed.
[theme]
palette = "dark"
font = "fonts/NotoSansSC.ttf"
font_size = 18.0

[slots]
"roundo.menu-root" = "main-menu"
"roundo.in-game-root" = "hud"
"roundo.main-menu" = "main-menu"
"roundo.hud" = "hud"
"roundo.settings" = "settings"
"roundo.pause-menu" = "pause-menu"

[[resource]]
name = "main-menu"
entry = "main-menu.toml"
interaction_mode = "ui"
world_visibility = "hidden"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [16, 21, 29, 255]
[resource.imports]
settings = "roundo.settings"

[[resource]]
name = "hud"
entry = "hud.toml"
interaction_mode = "in-game"
world_visibility = "visible"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [0, 0, 0, 0]

[[resource]]
name = "settings"
entry = "settings.toml"
interaction_mode = "ui"
world_visibility = "hidden"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [16, 21, 29, 255]

[[resource]]
name = "pause-menu"
entry = "pause-menu.toml"
interaction_mode = "ui"
world_visibility = "visible"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [5, 8, 12, 115]
[resource.imports]
settings = "roundo.settings"
