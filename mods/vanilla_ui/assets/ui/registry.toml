# Native UI Resource Type. No browser documents or executable scripts.
[theme]
palette = "dark"
font = "fonts/NotoSansSC.ttf"
font_size = 18.0
debug_receipt_timeout_secs = 15.0

[slots]
"roundo.menu-root" = "main-menu"
"roundo.in-game-root" = "hud"
"roundo.main-menu" = "main-menu"
"roundo.server-selection" = "server-selection"
"roundo.connecting" = "connecting"
"roundo.hud" = "hud"
"roundo.settings" = "settings"
"roundo.pause-menu" = "pause-menu"
"roundo.inventory" = "inventory"
"roundo.debug" = "debug"
"roundo.debug-life" = "debug-life"
"roundo.debug-inventories" = "debug-inventories"
"roundo.debug-items" = "debug-items"
"roundo.debug-runtime" = "debug-runtime"

[[resource]]
name = "main-menu"
entry = "main-menu.toml"
interaction_mode = "ui"
world_visibility = "hidden"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [16, 21, 29, 255]
[resource.imports]
server-selection = "roundo.server-selection"
settings = "roundo.settings"
debug = "roundo.debug"

