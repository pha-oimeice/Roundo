# Native UI Resource Type.
[theme]
palette = "dark"
font = "fonts/NotoSansSC.ttf"
font_size = 18.0

[slots]
"roundo.menu-root" = "main-menu"
"roundo.main-menu" = "main-menu"
"roundo.hud" = "hud"
"roundo.settings" = "settings"

[[resource]]
name = "main-menu"
entry = "main-menu.toml"
interaction_mode = "ui"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [16, 21, 29, 255]

[[resource]]
name = "hud"
entry = "hud.toml"
interaction_mode = "in-game"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [0, 0, 0, 0]

[[resource]]
name = "settings"
entry = "settings.toml"
interaction_mode = "ui"
max_instances = 1
lifecycle_independent = false
presentation = "exclusive"
layout = { kind = "fullscreen" }
background_color = [16, 21, 29, 255]
