[alias]
workspace-dev = "build --workspace --features dev --profile dev --color=always --message-format=json-diagnostic-rendered-ansi"
workspace-release = "build --workspace --features release --profile release --color=always --message-format=json-diagnostic-rendered-ansi"
server-dev = "build --package roundo_server --features dev --profile dev --color=always --message-format=json-diagnostic-rendered-ansi"
server-release = "build --package roundo_server --features release --profile release --color=always --message-format=json-diagnostic-rendered-ansi"
client-dev = "build --package roundo_client --features dev --profile dev --color=always --message-format=json-diagnostic-rendered-ansi"
client-release = "build --package roundo_client --features release --profile release --color=always --message-format=json-diagnostic-rendered-ansi"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-Clink-arg=-fuse-ld=mold",
    "-Zshare-generics=y",
    "-Zthreads=0",
]
rustdocflags = [
    "-Clink-arg=-fuse-ld=mold",
    "-Zshare-generics=y",
    "-Zthreads=0",
]