[package]
name = "roundo_game_network_bridge"
version.workspace = true
edition.workspace = true

[features]
default = []
client = ["dep:roundo_dsa"]
server = ["dep:roundo_ecs_entry", "roundo_ecs_entry/server"]
client-test = ["client", "server", "roundo_ecs_entry/client"]
dev = ["client-test"]

[dependencies]
log.workspace = true
serde.workspace = true
roundo_contracts.workspace = true
roundo_dsa = { workspace = true, optional = true }
roundo_ecs_entry = { workspace = true, optional = true, default-features = false }
roundo_local_coordinate.workspace = true
roundo_marionette.workspace = true
roundo_networking.workspace = true
roundo_presence.workspace = true
roundo_toolbox.workspace = true
